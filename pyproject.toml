[project]
name = "subscription-revenue-intelligence"
version = "0.1.0"
description = "Reproducible B2B SaaS subscription revenue and customer growth analytics platform"
requires-python = ">=3.9"
dependencies = [
  "duckdb>=1.1,<2",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyarrow>=15,<20",
  "pydantic>=2.5,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.7,<4",
  "seaborn>=0.13,<1",
  "joblib>=1.3,<2",
  "dbt-core>=1.8,<2",
  "dbt-duckdb>=1.8,<2",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4"]
airflow = ["apache-airflow>=2.9,<3"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
