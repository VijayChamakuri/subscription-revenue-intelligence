version: 1

metadata:
  disclosure: All outputs are calculated from synthetic data and must not be described as production outcomes.
  reporting_currency: USD after upstream currency conversion. Mixed-currency rows are exceptions until converted.

metrics:
  - {name: mrr, definition: Recurring monthly subscription value active at month end, sql: "sum(closing_mrr)", model: fct_mrr_movement, grain: month_customer_product_plan, owner: Revenue Operations, exclusions: [one-time fees, taxes, refunds], limitation: Event completeness is required, test: assert_mrr_bridge_rolls_forward}
  - {name: arr, definition: Month-end MRR annualized, sql: "sum(closing_mrr) * 12", model: fct_mrr_movement, grain: month, owner: Finance, exclusions: [one-time fees], limitation: Not GAAP revenue, test: mart_revenue_kpis.arr non_negative}
  - {name: new_mrr, definition: MRR from the first active month, sql: "sum(new_mrr)", model: fct_mrr_movement, grain: month, owner: Revenue Operations, exclusions: [reactivations], limitation: Depends on complete customer history, test: fct_mrr_movement cents_close}
  - {name: expansion_mrr, definition: Positive MRR change for an already active subscription, sql: "sum(expansion_mrr)", model: fct_mrr_movement, grain: month, owner: Customer Success, exclusions: [new, reactivation], limitation: Mixes seat and plan expansion, test: fct_mrr_movement cents_close}
  - {name: contraction_mrr, definition: Absolute negative MRR change while remaining active, sql: "sum(contraction_mrr)", model: fct_mrr_movement, grain: month, owner: Customer Success, exclusions: [full churn], limitation: Mixes seat and plan contraction, test: fct_mrr_movement cents_close}
  - {name: churned_mrr, definition: Prior MRR lost when closing MRR becomes zero, sql: "sum(churned_mrr)", model: fct_mrr_movement, grain: month, owner: Customer Success, exclusions: [partial contraction], limitation: Requires zero-MRR cancellation events, test: fct_mrr_movement cents_close}
  - {name: reactivation_mrr, definition: MRR returning after a prior active period and zero MRR, sql: "sum(reactivation_mrr)", model: fct_mrr_movement, grain: month, owner: Revenue Operations, exclusions: [first activation], limitation: Requires full history, test: fct_mrr_movement cents_close}
  - {name: net_new_mrr, definition: New plus expansion plus reactivation less contraction and churn, sql: "sum(new_mrr + expansion_mrr + reactivation_mrr - contraction_mrr - churned_mrr)", model: fct_mrr_movement, grain: month, owner: Finance, exclusions: [one-time fees], limitation: Movement metric, not recognized revenue, test: mart_mrr_bridge cents_close}
  - {name: gross_revenue_retention, definition: Opening MRR retained before expansion and reactivation, sql: "(opening_mrr - contraction_mrr - churned_mrr) / nullif(opening_mrr, 0)", model: mart_mrr_bridge, grain: month, owner: Executive, exclusions: [new, expansion, reactivation], limitation: Undefined with zero opening MRR, test: mart_revenue_kpis accepted_range}
  - {name: net_revenue_retention, definition: Opening MRR retained including expansion and reactivation, sql: "(opening_mrr + expansion_mrr + reactivation_mrr - contraction_mrr - churned_mrr) / nullif(opening_mrr, 0)", model: mart_mrr_bridge, grain: month, owner: Executive, exclusions: [new MRR], limitation: Undefined with zero opening MRR, test: mart_mrr_bridge cents_close}
  - {name: recognized_revenue, definition: Revenue recognized for delivered service, sql: "sum(recognized_amount)", model: fct_billing_reconciliation, grain: invoice, owner: Finance, exclusions: [deferred amounts], limitation: Synthetic schedule is simplified, test: assert_recognized_not_above_invoice_line}
  - {name: deferred_revenue, definition: Billed amount not yet recognized, sql: "sum(deferred_amount)", model: fct_billing_reconciliation, grain: invoice, owner: Finance, exclusions: [recognized amounts], limitation: Does not replace a general ledger, test: fct_billing_reconciliation deferred_amount non_negative}
  - {name: collected_cash, definition: Successful payments less refunds, sql: "sum(net_collected_cash)", model: fct_billing_reconciliation, grain: invoice, owner: Finance, exclusions: [failed payments], limitation: Timing differs from revenue, test: assert_invoice_arithmetic}
  - {name: failed_payment_exposure, definition: Amount of failed payment attempts, sql: "sum(failed_payment_exposure)", model: fct_billing_reconciliation, grain: invoice, owner: Billing Operations, exclusions: [successful attempts], limitation: Attempts can later recover, test: fct_billing_reconciliation failed_payment_exposure non_negative}
  - {name: refund_rate, definition: Refunds divided by successful payments, sql: "sum(refunded_amount) / nullif(sum(successful_payments), 0)", model: fct_billing_reconciliation, grain: month, owner: Finance, exclusions: [failed payments], limitation: Refund timing may differ, test: fct_billing_reconciliation refunded_amount non_negative}
  - {name: discount_leakage, definition: Discount above approved modeled policy threshold, sql: "sum(discount_amount) filter (where discount_amount > subtotal)", model: fct_billing_reconciliation, grain: invoice, owner: Revenue Operations, exclusions: [valid discounts], limitation: Approval data is not modeled, test: mart_finance_exceptions invalid_discount}
  - {name: logo_churn, definition: Customers moving from positive MRR to zero, sql: "count(distinct customer_id) filter (where movement_type = 'churn')", model: fct_mrr_movement, grain: month, owner: Customer Success, exclusions: [partial product churn if account remains active], limitation: Product-level rows require account rollup, test: fct_mrr_movement movement_type accepted_values}
  - {name: revenue_churn, definition: Churned MRR divided by opening MRR, sql: "churned_mrr / nullif(opening_mrr, 0)", model: mart_mrr_bridge, grain: month, owner: Executive, exclusions: [contraction], limitation: Undefined with zero opening MRR, test: mart_mrr_bridge cents_close}
  - {name: renewal_rate, definition: Renewed contracts divided by contracts eligible for renewal, sql: "renewed_contracts / nullif(eligible_contracts, 0)", model: stg_contracts, grain: renewal_month, owner: Customer Success, exclusions: [not-yet-due contracts], limitation: Renewal outcome must be derived downstream, test: assert_subscription_dates}
  - {name: cohort_retention, definition: Retained cohort customers divided by starting cohort customers, sql: "retained_customers / nullif(starting_customers, 0)", model: fct_mrr_movement, grain: acquisition_cohort_tenure, owner: Product, exclusions: [customers not yet observed], limitation: Right censoring affects recent cohorts, test: fct_mrr_movement customer relationship}
  - {name: arpa, definition: Closing MRR divided by active accounts, sql: "sum(closing_mrr) / nullif(count(distinct account_id), 0)", model: fct_mrr_movement, grain: month, owner: Revenue Operations, exclusions: [zero-MRR accounts], limitation: Customer-to-account mapping required, test: dim_customer account_id not_null}
  - {name: cac, definition: Channel spend divided by acquired customers, sql: "spend / nullif(acquired_customers, 0)", model: mart_channel_efficiency, grain: month_channel, owner: Marketing, exclusions: [unattributed spend], limitation: Simplified first-touch attribution, test: mart_channel_efficiency spend non_negative}
  - {name: ltv, definition: ARPA times gross margin divided by revenue churn rate, sql: "arpa * gross_margin_pct / nullif(revenue_churn_rate, 0)", model: fct_mrr_movement, grain: cohort, owner: Finance, exclusions: [nonrecurring revenue], limitation: Steady-state heuristic, test: dim_product gross_margin_pct accepted_range}
  - {name: ltv_to_cac, definition: Gross-margin-adjusted LTV divided by CAC, sql: "ltv / nullif(cac, 0)", model: mart_channel_efficiency, grain: cohort_channel, owner: Marketing, exclusions: [unattributed customers], limitation: Inherits LTV and attribution assumptions, test: mart_channel_efficiency unique grain}
  - {name: cac_payback_months, definition: CAC divided by monthly gross profit per account, sql: "cac / nullif(arpa * gross_margin_pct, 0)", model: mart_channel_efficiency, grain: cohort_channel, owner: Finance, exclusions: [zero-margin accounts], limitation: Ignores ramp and time value, test: dim_product gross_margin_pct accepted_range}
  - {name: feature_adoption, definition: Customers using the core feature divided by active customers, sql: "avg(core_feature_adopted::integer)", model: mart_customer_monthly_health, grain: month, owner: Product, exclusions: [inactive customers], limitation: Instrumentation coverage matters, test: mart_customer_monthly_health unique grain}
  - {name: support_burden, definition: Support tickets per active customer, sql: "sum(ticket_count) / nullif(count(distinct customer_id), 0)", model: mart_customer_monthly_health, grain: month, owner: Customer Success, exclusions: [noncustomer tickets], limitation: Ticket complexity varies, test: mart_customer_monthly_health ticket_count non_negative}
  - {name: time_to_value, definition: Days from acquisition to first recorded value event, sql: "date_diff('day', acquisition_date, first_value_at)", model: dim_customer, grain: customer, owner: Product, exclusions: [missing value event], limitation: Depends on operational definition of value, test: dim_customer customer_id unique}
  - {name: customer_health_score, definition: Modeled composite health score, sql: "avg(health_score)", model: stg_customer_health, grain: customer_score_date, owner: Customer Success, exclusions: [missing features], limitation: Predictive association is not causal, test: assert_no_temporal_health_leakage}
  - {name: lead_to_opportunity_conversion, definition: Converted opportunities divided by leads, sql: "opportunities / nullif(leads, 0)", model: mart_channel_efficiency, grain: month_channel, owner: Marketing, exclusions: [invalid leads], limitation: Simplified source attribution, test: mart_channel_efficiency leads non_negative}
  - {name: opportunity_to_win_conversion, definition: Closed-won opportunities divided by opportunities, sql: "wins / nullif(opportunities, 0)", model: mart_channel_efficiency, grain: month_channel, owner: Sales, exclusions: [open pipeline], limitation: Cohort maturity varies, test: mart_channel_efficiency unique grain}
  - {name: sales_cycle_length, definition: Average days from opportunity creation to close, sql: "avg_sales_cycle_days", model: mart_channel_efficiency, grain: month_channel, owner: Sales, exclusions: [open opportunities], limitation: Close-month grouping can bias recent periods, test: mart_channel_efficiency unique grain}
  - {name: win_rate, definition: Closed-won divided by all closed opportunities, sql: "wins / nullif(closed_opportunities, 0)", model: stg_opportunities, grain: close_month, owner: Sales, exclusions: [open opportunities], limitation: Outcome stages must be complete, test: stg_opportunities opportunity_id source uniqueness}
  - {name: pipeline_coverage, definition: Open pipeline value divided by target revenue, sql: "open_pipeline_value / nullif(target_revenue, 0)", model: stg_opportunities, grain: month, owner: Sales, exclusions: [closed opportunities], limitation: Targets are an external planning input, test: stg_opportunities opportunity_id source uniqueness}
  - {name: marketing_return, definition: Modeled gross profit attributed to a channel divided by spend, sql: "attributed_gross_profit / nullif(spend, 0)", model: mart_channel_efficiency, grain: month_channel, owner: Marketing, exclusions: [unattributed activity], limitation: Scenario metric, not causal incrementality, test: mart_channel_efficiency spend non_negative}

