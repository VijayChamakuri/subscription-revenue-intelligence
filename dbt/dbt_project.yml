name: subscription_revenue_intelligence
version: 1.0.0
config-version: 2

profile: subscription_revenue_intelligence

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  reporting_currency: USD
  movement_tolerance: 0.01

models:
  subscription_revenue_intelligence:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      core:
        +materialized: table
        +schema: core
      revenue:
        +materialized: table
        +schema: revenue
      finance:
        +materialized: table
        +schema: finance
      growth:
        +materialized: table
        +schema: growth
      quality:
        +materialized: table
        +schema: quality

