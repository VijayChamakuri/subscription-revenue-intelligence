        columns:
          - {name: plan_id, tests: [not_null, unique]}
      - name: marketing_channels
        columns:
          - {name: channel_id, tests: [not_null, unique]}
      - name: sales_reps
      - name: customer_success_managers
      - name: geographies
      - name: subscriptions
        columns:
          - {name: subscription_id, tests: [not_null, unique]}
      - name: subscription_events
        columns:
          - {name: subscription_event_id, tests: [not_null, unique]}
      - name: invoices
        columns:
          - {name: invoice_id, tests: [not_null]}
      - name: invoice_lines
      - name: payments
        columns:
          - {name: payment_id, tests: [not_null, unique]}
      - name: refunds
