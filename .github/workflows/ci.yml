name: validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --extra dev
      - run: uv run python -m src.generation.generate --config config/project.yml
      - run: uv run python -m src.validation.validate_sources --data-dir data/raw
      - run: uv run python -m src.ingestion.load_duckdb --data-dir data/raw --database data/warehouse/subscription.duckdb
      - run: cd dbt && ../.venv/bin/dbt deps --profiles-dir .
      - run: cd dbt && ../.venv/bin/dbt build --profiles-dir .
      - run: uv run pytest
      - run: uv run ruff check src tests spark airflow
